<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Backoffice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="auth">
    <aside class="auth-aside">
      <p class="logo">Backoffice</p>
      <div>
        <p class="tagline">Todo tu negocio en un solo lugar.</p>
        <p class="lead">Controla pedidos, clientes e ingresos desde un panel simple.</p>
      </div>
    </aside>

    <main class="auth-main">
      <section class="card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Accede para administrar tu negocio.</p>

        <form action="login.html" method="post">
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn" type="submit">Entrar</button>
        </form>

        <p class="switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
      </section>
    </main>
  </div>
</body>
</html>
