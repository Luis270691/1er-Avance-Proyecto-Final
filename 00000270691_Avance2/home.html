<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos | Backoffice</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
  <script src="home.js" defer></script>
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <p class="logo">Backoffice</p>
      <div class="user">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-outline inline" id="logout" type="button">Salir</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div>
          <h1>Mis proyectos</h1>
          <p class="subtitle">Administra los proyectos de tu portafolio.</p>
        </div>
        <button class="btn inline" id="add-btn" type="button">+ Agregar proyecto</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <p id="empty" class="status" hidden>Aún no tienes proyectos. Agrega el primero.</p>
      <section id="projects" class="projects" aria-label="Proyectos"></section>
    </main>
  </div>

  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <h2 id="dialog-title">Agregar proyecto</h2>
      <p id="form-alert" class="alert" role="alert" hidden></p>

      <div class="field">
        <label for="title">Título</label>
        <input id="title" name="title" type="text" required>
      </div>
      <div class="field">
        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="4" required></textarea>
      </div>
      <div class="field">
        <label for="technologies">Tecnologías (separadas por coma)</label>
        <input id="technologies" name="technologies" type="text" placeholder="React, Node, MongoDB">
      </div>
      <div class="field">
        <label for="repository">Repositorio (URL)</label>
        <input id="repository" name="repository" type="url" placeholder="https://github.com/...">
      </div>

      <div class="actions">
        <button class="btn btn-outline inline" id="cancel-btn" type="button">Cancelar</button>
        <button class="btn inline" id="save-btn" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <template id="project-template">
    <article class="project">
      <h2 class="project-title"></h2>
      <p class="project-desc"></p>
      <ul class="tags"></ul>
      <a class="project-link" target="_blank" rel="noopener" hidden>Ver repositorio</a>
      <div class="actions">
        <button class="btn btn-outline inline" type="button" data-action="edit">Actualizar</button>
        <button class="btn btn-danger inline" type="button" data-action="delete">Eliminar</button>
      </div>
    </article>
  </template>
</body>
</html>
