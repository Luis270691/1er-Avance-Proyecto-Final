<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Backoffice</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
  <script src="register.js" defer></script>
</head>
<body>
  <div class="auth">
    <aside class="auth-aside">
      <p class="logo">Backoffice</p>
      <div>
        <p class="tagline">Empieza hoy, sin complicaciones.</p>
        <p class="lead">Crea tu cuenta en menos de un minuto y organiza tu portafolio.</p>
      </div>
    </aside>

    <main class="auth-main">
      <section class="card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Completa tus datos para comenzar.</p>

        <p id="alert" class="alert" role="alert" hidden></p>

        <form id="register-form">
          <div class="field">
            <label for="name">Nombre completo</label>
            <input id="name" name="name" type="text" autocomplete="name" minlength="6" required>
          </div>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="itsonId">ID ITSON</label>
            <input id="itsonId" name="itsonId" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" title="6 dígitos numéricos" required>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
          </div>
          <button class="btn" type="submit">Crear cuenta</button>
        </form>

        <p class="switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
    </main>
  </div>
</body>
</html>
